<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Olugbenga Crown | Project Manager</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#060E1A;color:#E2EBF3;font-family:'Outfit',system-ui,sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#060E1A}
::-webkit-scrollbar-thumb{background:rgba(232,184,75,0.3);border-radius:99px}

.fd{font-family:'Cormorant Garamond',Georgia,serif}
.fb{font-family:'Outfit',system-ui,sans-serif}

/* Animations */
@keyframes fadeInUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.95) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
@keyframes chatPop{from{opacity:0;transform:scale(0.8) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
@keyframes stag{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,184,75,0.5)}70%{box-shadow:0 0 0 10px rgba(232,184,75,0)}}

.page-in{animation:scaleIn 0.38s cubic-bezier(0.16,1,0.3,1) both}
.s0{animation:stag 0.55s 0.0s ease both}
.s1{animation:stag 0.55s 0.1s ease both}
.s2{animation:stag 0.55s 0.2s ease both}
.s3{animation:stag 0.55s 0.3s ease both}
.s4{animation:stag 0.55s 0.4s ease both}
.s5{animation:stag 0.55s 0.5s ease both}
.s6{animation:stag 0.55s 0.6s ease both}

/* Nav */
.nav-link{color:#6B7F93;font-size:0.75rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:color 0.2s;position:relative;padding-bottom:3px;background:none;border:none;font-family:'Outfit',sans-serif}
.nav-link:hover,.nav-link.active{color:#E8B84B}
.nav-link.active::after{content:'';position:absolute;bottom:-1px;left:0;width:100%;height:2px;background:#E8B84B;border-radius:1px}

/* Hub Cards */
.hub-card{background:#0C1B2B;border:1px solid rgba(255,255,255,0.055);border-radius:15px;padding:34px 30px;cursor:pointer;transition:all 0.35s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
.hub-card::after{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(232,184,75,0.07) 0%,transparent 60%);opacity:0;transition:opacity 0.35s}
.hub-card:hover{transform:translateY(-9px);border-color:rgba(232,184,75,0.45);box-shadow:0 28px 70px rgba(0,0,0,0.55)}
.hub-card:hover::after{opacity:1}
.hub-card:hover .hc-arrow{transform:translateX(6px);opacity:1;color:#E8B84B}
.hc-arrow{opacity:0.25;transition:all 0.3s;color:#E8B84B;font-size:1.1rem;display:inline-block}

/* Buttons */
.btn-gold{background:#E8B84B;color:#060E1A;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:700;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all 0.25s;display:inline-flex;align-items:center;gap:8px;padding:13px 26px;text-decoration:none}
.btn-gold:hover{background:#F5CC6A;transform:translateY(-2px);box-shadow:0 10px 28px rgba(232,184,75,0.4)}
.btn-out{background:transparent;color:#E2EBF3;border:1px solid rgba(232,184,75,0.38);border-radius:8px;font-family:'Outfit',sans-serif;font-weight:500;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all 0.25s;display:inline-flex;align-items:center;gap:8px;padding:13px 26px}
.btn-out:hover{border-color:#E8B84B;background:rgba(232,184,75,0.08);transform:translateY(-2px)}
.btn-ghost{background:none;border:none;color:#E8B84B;font-family:'Outfit',sans-serif;font-weight:700;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:0;transition:gap 0.2s}
.btn-ghost:hover{gap:9px}

/* Cards */
.card{background:#0C1B2B;border:1px solid rgba(255,255,255,0.055);border-radius:14px}
.svc-card{background:#0C1B2B;border:1px solid rgba(255,255,255,0.055);border-radius:13px;padding:28px;transition:all 0.3s}
.svc-card:hover{border-color:rgba(232,184,75,0.32);transform:translateY(-5px);background:#0E1F33}
.case-card{background:#0C1B2B;border:1px solid rgba(255,255,255,0.055);border-radius:15px;overflow:hidden;transition:all 0.35s}
.case-card:hover{transform:translateY(-7px);box-shadow:0 24px 64px rgba(0,0,0,0.5);border-color:rgba(232,184,75,0.28)}
.tcard{background:#0C1B2B;border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:30px;cursor:pointer;transition:all 0.28s}
.tcard:hover,.tcard.tact{border-color:rgba(232,184,75,0.45) !important}

/* Form */
.fi{width:100%;background:#0A1829;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:13px 16px;color:#E2EBF3;font-family:'Outfit',sans-serif;font-size:0.88rem;outline:none;transition:border-color 0.22s;resize:vertical}
.fi:focus{border-color:rgba(232,184,75,0.6)}
.fi::placeholder{color:#3D5166}

/* Skill bar */
.sbar{height:5px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden}
.sfill{height:100%;background:linear-gradient(90deg,#E8B84B,#F5CC6A);border-radius:99px;animation:barGrow 1.2s cubic-bezier(0.16,1,0.3,1) forwards}

/* Grid bg */
.gpat{background-image:linear-gradient(rgba(232,184,75,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(232,184,75,0.022) 1px,transparent 1px);background-size:52px 52px}

/* Chatbot */
.chat-pop{animation:chatPop 0.32s cubic-bezier(0.16,1,0.3,1) both}
.dot-typing span{display:inline-block;width:5px;height:5px;background:#E8B84B;border-radius:50%;margin:0 2px;animation:blink 1.4s infinite}
.dot-typing span:nth-child(2){animation-delay:0.22s}
.dot-typing span:nth-child(3){animation-delay:0.44s}

/* Section divider */
.gdiv{width:60px;height:3px;background:linear-gradient(90deg,transparent,#E8B84B,transparent);margin:0 auto;border-radius:2px}

/* Responsive */
@media(max-width:768px){
  .hide-mob{display:none !important}
  .show-mob{display:flex !important}
  .mob-stack{flex-direction:column !important}
  .mob-center{text-align:center !important}
  .mob-full{width:100% !important}
  .hero-h{font-size:clamp(2.8rem,12vw,5rem) !important}
}
@media(min-width:769px){.show-mob{display:none !important}}

/* Glow dot */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Tag badge */
.tag{display:inline-flex;align-items:center;font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:4px 11px;border-radius:999px}

/* Icon box */
.ibox{display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(232,184,75,0.08);border:1px solid rgba(232,184,75,0.22);flex-shrink:0}

/* Section label */
.slabel{color:#E8B84B;font-size:0.72rem;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;margin-bottom:12px}

/* Tooltip transition */
.fade-tr{transition:opacity 0.2s,transform 0.2s}

/* Mobile menu */
.mob-menu{position:fixed;top:70px;left:0;right:0;z-index:198;background:rgba(6,14,26,0.97);backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,0.05);padding:20px 24px 28px;animation:fadeIn 0.22s ease}
</style>
</head>

/* ── ROOT ── */
function App() {
  const [page, setPage]   = useState("home");
  const [fading, setFade] = useState(false);

  const go = useCallback((to) => {
    if (to === page) return;
    setFade(true);
    setTimeout(() => {
      setPage(to);
      setFade(false);
      window.scrollTo({top:0, behavior:"smooth"});
    }, 200);
  }, [page]);

  const PAGES = {home:Home, about:About, portfolio:Portfolio, services:Services, testimonials:Testimonials, contact:Contact};
  const Page  = PAGES[page] || Home;

  return (
    <div style={{minHeight:"100vh",background:BG,color:"#E2EBF3",fontFamily:"'Outfit',system-ui,sans-serif"}}>
      <Nav page={page} go={go}/>
      <div style={{opacity:fading?0:1, transform:fading?"translateY(8px)":"translateY(0)", transition:"opacity 0.2s ease, transform 0.2s ease"}}>
        <Page go={go}/>
      </div>
      <Footer go={go}/>
      <Chatbot/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
